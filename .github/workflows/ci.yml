name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests-sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v
      - name: Demo must match the ground truth exactly
        run: python -m finrecon.pipeline demo --strict
      - name: Captured sandbox snapshot must match the ground truth exactly
        run: python -m finrecon.pipeline demo --strict
        env:
          FIXTURE_DIR: fixtures/live_snapshot
          DATABASE_URL: sqlite:///data/snapshot.db
      - run: python -m finrecon.pipeline report

  tests-postgres:
    name: Tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finrecon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finrecon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Full test suite against PostgreSQL (psycopg driver path)
        run: python -m pytest -v
      - name: Demo on PostgreSQL must match the ground truth exactly
        run: python -m finrecon.pipeline demo --strict

  docker-stack:
    name: Docker stack end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-owner-pw/' .env
          sed -i 's/^DASHBOARD_DB_PASSWORD=.*/DASHBOARD_DB_PASSWORD=ci-readonly-pw/' .env
          sed -i 's/^DOMAIN=.*/DOMAIN=:80/' .env
      - name: Build the image exactly as deploy/aws/user_data.sh does (classic builder)
        run: DOCKER_BUILDKIT=0 docker build -t finrecon-app:latest -f docker/Dockerfile .
      - run: docker compose up -d db
      - name: Pipeline job on PostgreSQL in Docker
        run: |
          docker compose run --rm pipeline | tee pipeline.log
          grep -E "([0-9]+) / \1 scenarios passed" pipeline.log
      - run: docker compose up -d --no-build dashboard caddy
      - name: Dashboard answers through Caddy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost/_stcore/health; then echo; exit 0; fi
            sleep 2
          done
          exit 1
      - name: Dashboard database role is read-only
        run: |
          docker compose exec -T db psql -U dashboard_ro -d finrecon -c "SELECT COUNT(*) FROM reconciliation_results"
          if docker compose exec -T db psql -U dashboard_ro -d finrecon -c "DELETE FROM clients"; then
            echo "dashboard_ro was able to write"; exit 1
          fi
          echo "write refused as expected"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
