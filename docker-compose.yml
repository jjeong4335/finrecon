# Single-host deployment (EC2 or laptop). Only Caddy publishes ports.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finrecon
      POSTGRES_USER: finrecon_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DASHBOARD_DB_PASSWORD: ${DASHBOARD_DB_PASSWORD:?set DASHBOARD_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finrecon_owner -d finrecon"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # One-shot job: (re)builds the demo database from the offline fixtures or a
  # captured sandbox snapshot. Re-run with: docker compose run --rm pipeline
  pipeline:
    build: { context: ., dockerfile: docker/Dockerfile }
    command: ["python", "-m", "finrecon.pipeline", "demo"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://finrecon_owner:${POSTGRES_PASSWORD}@db:5432/finrecon
      RAW_DIR: /app/data/raw
    volumes:
      - rawdata:/app/data
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  # Optional real-data module: downloads UCI Online Retail II (about 44 MB, CC BY 4.0)
  # and loads ~1.07M rows. Does not block the dashboard. Re-run:
  #   docker compose run --rm retail
  retail:
    build: { context: ., dockerfile: docker/Dockerfile }
    command: ["python", "-m", "finrecon.ingestion.uci_retail", "all", "--file", "/app/data/external/online_retail_II.zip"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://finrecon_owner:${POSTGRES_PASSWORD}@db:5432/finrecon
    volumes:
      - rawdata:/app/data
    depends_on:
      pipeline: { condition: service_completed_successfully }
    restart: "no"

  dashboard:
    build: { context: ., dockerfile: docker/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dashboard_ro:${DASHBOARD_DB_PASSWORD}@db:5432/finrecon
      MODE: offline     # the public dashboard never needs live tokens
    depends_on:
      pipeline: { condition: service_completed_successfully }
    restart: unless-stopped

  # Internal only (no published port): lets you inspect the mock ad API, e.g.
  # docker compose exec dashboard python -c "import requests;print(requests.get('http://mock-api:8001/clients').json())"
  mock-api:
    build: { context: ., dockerfile: docker/Dockerfile }
    command: ["uvicorn", "mock_ad_api.app:app", "--host", "0.0.0.0", "--port", "8001"]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [dashboard]
    restart: unless-stopped

volumes:
  pgdata:
  rawdata:
  caddy_data:
